# ==============================================================================
# StockEase Ansible Inventory
# ==============================================================================
# This project uses Ansible to orchestrate Kubernetes deployments locally.
# The "localhost" connection means Ansible runs kubectl commands directly
# on the control machine where kubectl is configured and cluster is accessible.
# ==============================================================================

[k8s_control]
localhost ansible_connection=local

[k8s_control:vars]
# Kubernetes namespace for StockEase
k8s_namespace=stockease

# Path to the Kubernetes manifests directory (relative to repo root)
# Adjust this path if running Ansible from a different working directory
manifests_dir=../kubernetes

# kubectl binary path (adjust if kubectl is not in your PATH)
kubectl_bin=kubectl
kubectl=kubectl

# Minikube-specific: set to true if using minikube and need image loading
use_minikube=true
