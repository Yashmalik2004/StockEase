[defaults]
# Inventory file location
inventory = inventory/hosts.ini

# Remote user (not used for local K8s automation, kept for reference)
remote_user = ubuntu

# Disable SSH host key checking for local/dev environments
host_key_checking = False

# Output formatting (Ansible core 2.13+ format)
stdout_callback = default

[callback_default]
result_format = yaml

# Retry files (avoid creating .retry files in the project)
retry_files_enabled = False

# Roles path
roles_path = roles

# Timeout for connection (seconds)
timeout = 30

# Collections path
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections

[privilege_escalation]
become = False
