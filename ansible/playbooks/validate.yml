---
# ==============================================================================
# StockEase – Ansible Cluster Validation Playbook
# Phase 6: Ansible Automation
#
# A lightweight playbook to verify that all StockEase Kubernetes resources
# are healthy and the application is accessible. Run this after deploy.yml
# or any time you want to check cluster health without re-deploying.
#
# Usage:
#   ansible-playbook playbooks/validate.yml
#   ansible-playbook playbooks/validate.yml -v
# ==============================================================================

- name: StockEase – Kubernetes Resource Validation
  hosts: k8s_control
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"

  tasks:
    # --------------------------------------------------------------------------
    # Cluster Connectivity
    # --------------------------------------------------------------------------
    - name: "CHECK | Kubernetes cluster connectivity"
      ansible.builtin.command: "{{ kubectl_bin }} cluster-info"
      register: cluster_check
      changed_when: false
      failed_when: cluster_check.rc != 0
      tags: [cluster]

    - name: "CHECK | Cluster reachable – OK"
      ansible.builtin.debug:
        msg: "Cluster is reachable."
      tags: [cluster]

    # --------------------------------------------------------------------------
    # Namespace
    # --------------------------------------------------------------------------
    - name: "CHECK | StockEase namespace exists"
      ansible.builtin.command: >
        {{ kubectl_bin }} get namespace {{ k8s_namespace }} -o jsonpath='{.status.phase}'
      register: ns_phase
      changed_when: false
      failed_when: ns_phase.rc != 0 or ns_phase.stdout != "Active"
      tags: [namespace]

    - name: "CHECK | Namespace '{{ k8s_namespace }}' – Active"
      ansible.builtin.debug:
        msg: "Namespace '{{ k8s_namespace }}' is Active."
      tags: [namespace]

    # --------------------------------------------------------------------------
    # Persistent Volume Claim
    # --------------------------------------------------------------------------
    - name: "CHECK | MongoDB PVC exists and is Bound"
      ansible.builtin.command: >
        {{ kubectl_bin }} get pvc mongodb-pvc -n {{ k8s_namespace }} -o jsonpath='{.status.phase}'
      register: pvc_phase
      changed_when: false
      failed_when: pvc_phase.rc != 0 or pvc_phase.stdout != "Bound"
      tags: [pvc, storage]

    - name: "CHECK | MongoDB PVC – Bound"
      ansible.builtin.debug:
        msg: "MongoDB PVC 'mongodb-pvc' is Bound."
      tags: [pvc, storage]

    # --------------------------------------------------------------------------
    # Deployments Availability
    # --------------------------------------------------------------------------
    - name: "CHECK | MongoDB Deployment is available"
      ansible.builtin.command: >
        {{ kubectl_bin }} rollout status deployment/mongodb -n {{ k8s_namespace }} --timeout=30s
      register: mongodb_deploy_status
      changed_when: false
      failed_when: mongodb_deploy_status.rc != 0
      tags: [deployments, mongodb]

    - name: "CHECK | Backend Deployment is available"
      ansible.builtin.command: >
        {{ kubectl_bin }} rollout status deployment/backend -n {{ k8s_namespace }} --timeout=30s
      register: backend_deploy_status
      changed_when: false
      failed_when: backend_deploy_status.rc != 0
      tags: [deployments, backend]

    - name: "CHECK | Frontend Deployment is available"
      ansible.builtin.command: >
        {{ kubectl_bin }} rollout status deployment/frontend -n {{ k8s_namespace }} --timeout=30s
      register: frontend_deploy_status
      changed_when: false
      failed_when: frontend_deploy_status.rc != 0
      tags: [deployments, frontend]

    # --------------------------------------------------------------------------
    # Services
    # --------------------------------------------------------------------------
    - name: "CHECK | Required Services exist (mongodb, backend, frontend)"
      ansible.builtin.command: >
        {{ kubectl_bin }} get service {{ item }} -n {{ k8s_namespace }} --no-headers
      register: svc_check
      loop:
        - mongodb
        - backend
        - frontend
      changed_when: false
      failed_when: svc_check.rc != 0
      tags: [services]

    - name: "CHECK | Services confirmed"
      ansible.builtin.debug:
        msg: "Service '{{ item.item }}' exists in namespace '{{ k8s_namespace }}'."
      loop: "{{ svc_check.results }}"
      tags: [services]

    # --------------------------------------------------------------------------
    # MongoDB
    # --------------------------------------------------------------------------
    - name: "CHECK | MongoDB pod is Running and Ready"
      ansible.builtin.command: >
        {{ kubectl_bin }} wait pod
        -l app=mongodb
        -n {{ k8s_namespace }}
        --for=condition=Ready
        --timeout=30s
      register: mongodb_check
      changed_when: false
      failed_when: mongodb_check.rc != 0
      tags: [mongodb]

    - name: "CHECK | MongoDB – Ready"
      ansible.builtin.debug:
        msg: "MongoDB pod is Ready: {{ mongodb_check.stdout }}"
      tags: [mongodb]

    # --------------------------------------------------------------------------
    # Backend
    # --------------------------------------------------------------------------
    - name: "CHECK | Backend pod is Running and Ready"
      ansible.builtin.command: >
        {{ kubectl_bin }} wait pod
        -l app=backend
        -n {{ k8s_namespace }}
        --for=condition=Ready
        --timeout=30s
      register: backend_check
      changed_when: false
      failed_when: backend_check.rc != 0
      tags: [backend]

    - name: "CHECK | Backend – Ready"
      ansible.builtin.debug:
        msg: "Backend pod is Ready: {{ backend_check.stdout }}"
      tags: [backend]

    # --------------------------------------------------------------------------
    # Frontend
    # --------------------------------------------------------------------------
    - name: "CHECK | Frontend pod is Running and Ready"
      ansible.builtin.command: >
        {{ kubectl_bin }} wait pod
        -l app=frontend
        -n {{ k8s_namespace }}
        --for=condition=Ready
        --timeout=30s
      register: frontend_check
      changed_when: false
      failed_when: frontend_check.rc != 0
      tags: [frontend]

    - name: "CHECK | Frontend – Ready"
      ansible.builtin.debug:
        msg: "Frontend pod is Ready: {{ frontend_check.stdout }}"
      tags: [frontend]

    # --------------------------------------------------------------------------
    # Backend Health Endpoint (via kubectl port-forward)
    # --------------------------------------------------------------------------
    - name: "CHECK | Backend /api/health via kubectl exec"
      ansible.builtin.command: >
        {{ kubectl_bin }} exec
        -n {{ k8s_namespace }}
        deployment/backend
        -- wget -qO- http://localhost:5000/api/health
      register: health_check
      changed_when: false
      failed_when: health_check.rc != 0 or '"ok"' not in health_check.stdout
      tags: [health, backend]

    - name: "CHECK | Backend health response"
      ansible.builtin.debug:
        msg: "Backend health: {{ health_check.stdout }}"
      tags: [health, backend]

    # --------------------------------------------------------------------------
    # Frontend HTTP Delivery
    # --------------------------------------------------------------------------
    - name: "CHECK | Frontend HTTP delivery (status 200)"
      ansible.builtin.command: >
        {{ kubectl_bin }} exec
        -n {{ k8s_namespace }}
        deployment/frontend
        -- wget -qO- http://127.0.0.1:80/
      register: frontend_http_check
      changed_when: false
      failed_when: frontend_http_check.rc != 0 or 'StockEase' not in frontend_http_check.stdout
      tags: [health, frontend]

    - name: "CHECK | Frontend HTTP response"
      ansible.builtin.debug:
        msg: "Frontend HTML bundle served successfully (StockEase SPA confirmed)."
      tags: [health, frontend]

    # --------------------------------------------------------------------------
    # Summary
    # --------------------------------------------------------------------------
    - name: "SUMMARY | All validation checks passed"
      ansible.builtin.debug:
        msg: |
          ============================================================
           StockEase Kubernetes Validation – ALL CHECKS PASSED
          ============================================================
           Cluster connectivity  : OK
           Namespace stockease   : Active
           MongoDB PVC           : Bound
           Deployments           : mongodb, backend, frontend Available
           Services              : mongodb, backend, frontend Active
           Pods                  : mongodb, backend, frontend Ready
           Backend /api/health   : OK
           Frontend HTTP delivery: OK (StockEase SPA)
          ------------------------------------------------------------
           Frontend URL:
             minikube service frontend -n stockease --url
          ============================================================
      tags: [always]
