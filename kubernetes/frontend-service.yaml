apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: stockease
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: stockease
    app.kubernetes.io/component: ui
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
