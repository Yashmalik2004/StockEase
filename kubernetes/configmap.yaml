apiVersion: v1
kind: ConfigMap
metadata:
  name: stockease-config
  namespace: stockease
  labels:
    app.kubernetes.io/name: stockease-config
    app.kubernetes.io/part-of: stockease
data:
  PORT: "5000"
  MONGO_URI: "mongodb://mongodb:27017/stockease"
  MONGO_INITDB_DATABASE: "stockease"
  JWT_EXPIRES_IN: "7d"
  FRONTEND_URL: "http://localhost:30080"
