apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stockease
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: stockease
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: stockease
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: backend
          image: stockease-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: stockease-config
                  key: PORT
            - name: MONGO_URI
              valueFrom:
                configMapKeyRef:
                  name: stockease-config
                  key: MONGO_URI
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: stockease-config
                  key: JWT_EXPIRES_IN
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: stockease-config
                  key: FRONTEND_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockease-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
