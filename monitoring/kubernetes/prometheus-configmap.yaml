apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: stockease
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: stockease
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        project: 'stockease'
        environment: 'kubernetes'

    rule_files:
      - '/etc/prometheus/rules/alert_rules.yml'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'stockease-backend'
        metrics_path: '/metrics'
        scrape_interval: 10s
        static_configs:
          - targets: ['backend:5000']
            labels:
              service: 'stockease-backend'
              namespace: 'stockease'

  alert_rules.yml: |
    groups:
      - name: stockease_alerts
        interval: 30s
        rules:
          - alert: BackendDown
            expr: up{job="stockease-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "StockEase backend is down"
              description: "The StockEase backend has been unreachable for more than 1 minute."

          - alert: HighErrorRate
            expr: |
              rate(stockease_http_requests_total{status_code=~"5.."}[5m]) /
              rate(stockease_http_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High HTTP error rate"
              description: "More than 5% of requests are returning 5xx errors."

          - alert: HighRequestLatency
            expr: |
              histogram_quantile(0.95,
                rate(stockease_http_request_duration_seconds_bucket[5m])
              ) > 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High request latency"
              description: "95th percentile latency is above 1 second."
